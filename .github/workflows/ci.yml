name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images and start the stack
        # --wait blocks until both services report healthy (or fails).
        run: docker compose up --build --detach --wait

      - name: End-to-end tests through nginx
        run: node --test "e2e/*.test.mjs"

      - name: With the backend down, nginx answers 502 and still serves the app
        run: |
          docker compose stop backend
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST             localhost:3000/api/v1/add -H 'Content-Type: application/json' -d '{"a":"1","b":"1"}')"
          test "$status" = 502
          curl --fail --silent --output /dev/null localhost:3000/

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down
